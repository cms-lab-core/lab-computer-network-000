<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<rect width="1400" height="500" fill="#fff"/>
<style>
text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#202124}
.title{font-size:34px;font-weight:700}
.sub{font-size:20px;fill:#5f6368}
.node{fill:#fff;stroke:#5f6368;stroke-width:3}
.name{font-size:30px;font-weight:700}
.mono{font-family:'DejaVu Sans Mono',monospace;font-size:20px}
.link{stroke:#747b83;stroke-width:7;stroke-linecap:round}
.mgmt{font-size:17px;fill:#6b7280}
</style>
<text class="title" x="700" y="62" text-anchor="middle">Lab 000: минимальный реальный стенд для onboarding</text>
<text class="sub" x="700" y="102" text-anchor="middle">Адреса eth1 уже настроены — в этой работе мы учимся пользоваться средой, а не настраивать сеть</text>
<line class="link" x1="470" y1="270" x2="930" y2="270"/>
<text class="mono" x="700" y="240" text-anchor="middle">192.0.2.0/24 · учебный data plane</text>
<text class="mgmt" x="700" y="315" text-anchor="middle">capture делаем на pc1:eth1 · management eth0 не меняем</text>
<rect class="node" x="190" y="180" width="280" height="180" rx="24"/>
<text class="name" x="330" y="245" text-anchor="middle">pc1</text>
<text class="sub" x="330" y="287" text-anchor="middle">Linux / netshoot</text>
<text class="mono" x="330" y="325" text-anchor="middle">eth1 192.0.2.10/24</text>
<rect class="node" x="930" y="180" width="280" height="180" rx="24"/>
<text class="name" x="1070" y="245" text-anchor="middle">pc2</text>
<text class="sub" x="1070" y="287" text-anchor="middle">Linux / netshoot</text>
<text class="mono" x="1070" y="325" text-anchor="middle">eth1 192.0.2.20/24</text>
</svg>
